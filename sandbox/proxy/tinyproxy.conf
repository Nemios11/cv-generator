# Network policy of the agent sandbox (see docs/adr/0006-sandbox-agent.md).
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Connect

# TLS tunnels (CONNECT) only to port 443. Plain HTTP is forwarded only to
# allowlisted hosts (they all redirect to HTTPS).
ConnectPort 443

# Default deny: a host is reachable only if it matches a line of the allowlist.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"

# Do not tell upstream servers that a proxy is in the middle.
DisableViaHeader Yes
