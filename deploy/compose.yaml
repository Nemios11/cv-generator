# One environment of CV Generator: the full stack of one released version.
#
# The same file is used for dev, staging and prod; what changes is only the
# environment file (deploy/env/<env>.env: name, port, flags) and the secrets
# file generated by deploy/stack.sh outside the repository. Do not run it
# directly: use
#     bash deploy/stack.sh <env> up <version>
#
# Each environment is a separate Compose project (cv-dev, cv-staging, cv-prod):
# own containers, own network, own database volume. Only the web entry point is
# published, on 127.0.0.1.
#
# Not to be confused with ../compose.yaml, which starts only Postgres and
# Keycloak for running the app from the IDE.

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: cvgenerator
      POSTGRES_USER: cvgenerator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by deploy/stack.sh}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?generated by deploy/stack.sh}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvgenerator -d cvgenerator"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # The browser reaches Keycloak through the web entry point, same origin
      # as the app: tokens carry this issuer.
      KC_HOSTNAME: http://localhost:${WEB_PORT:?set in deploy/env/<env>.env}
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?generated by deploy/stack.sh}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      - ../infra/keycloak/realm-cv-generator.json:/opt/keycloak/data/import/realm-cv-generator.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: probe the management port with bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

  api:
    # The version is the commit the image was built from (deploy/build.sh).
    image: localhost/cv-generator-api:${CV_VERSION:?pass the version to deploy/stack.sh}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cvgenerator
      DB_USER: cvgenerator
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Tokens are checked against the public issuer, but the signing keys are
      # fetched from Keycloak inside the network.
      OIDC_ISSUER_URI: http://localhost:${WEB_PORT}/realms/cv-generator
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/cv-generator/protocol/openid-connect/certs
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CV_ENV: ${CV_ENV}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl: same /dev/tcp probe as Keycloak. /dev/tcp
      # is a bash feature; the image's /bin/sh is dash, hence bash -c.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  web:
    image: localhost/cv-generator-web:${CV_VERSION}
    ports:
      - "127.0.0.1:${WEB_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp
      # The entrypoint renders the nginx template here at start.
      - /etc/nginx/conf.d:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata:
