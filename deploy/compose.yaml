# One environment of CV Generator: the full stack of one released version.
#
# The same file is used for dev, staging and prod; what changes is only the
# environment file (deploy/env/<env>.env: name, port, flags) and the secrets
# file generated by deploy/stack.sh outside the repository. Do not run it
# directly: use
#     bash deploy/stack.sh <env> release <version>
#
# Each environment is a separate Compose project (cv-dev, cv-staging, cv-prod):
# own containers, own network, own database volume. Only the web entry point is
# published, on 127.0.0.1.
#
# Every image of the application is versioned (CV_VERSION, the commit SHA),
# configuration included: the realm and the database init script are baked into
# the db and idp images. Nothing is mounted from the checkout, so the stack can
# be started from anywhere that talks to the container engine, such as the
# deploy MCP server (deploy/mcp).
#
# Not to be confused with ../compose.yaml, which starts only Postgres and
# Keycloak for running the app from the IDE.

services:
  postgres:
    image: localhost/cv-generator-db:${CV_VERSION:?pass the version to deploy/stack.sh}
    environment:
      POSTGRES_DB: cvgenerator
      POSTGRES_USER: cvgenerator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by deploy/stack.sh}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?generated by deploy/stack.sh}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvgenerator -d cvgenerator"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  keycloak:
    image: localhost/cv-generator-idp:${CV_VERSION}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # The browser reaches Keycloak through the web entry point, same origin
      # as the app: tokens carry this issuer.
      KC_HOSTNAME: http://localhost:${WEB_PORT:?set in deploy/env/<env>.env}
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?generated by deploy/stack.sh}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
      # Placeholder in the realm file, resolved at import.
      CV_SYNTHETIC_CLIENT_SECRET: ${CV_SYNTHETIC_CLIENT_SECRET:?generated by deploy/stack.sh}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: probe the management port with bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

  api:
    # The version is the commit the image was built from (deploy/build.sh).
    image: localhost/cv-generator-api:${CV_VERSION}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cvgenerator
      DB_USER: cvgenerator
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Tokens are checked against the public issuer, but the signing keys are
      # fetched from Keycloak inside the network.
      OIDC_ISSUER_URI: http://localhost:${WEB_PORT}/realms/cv-generator
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/cv-generator/protocol/openid-connect/certs
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CV_ENV: ${CV_ENV}
      # Actuator on a separate port, internal to this network and not published:
      # health for the healthcheck, Prometheus metrics for the deploy "status"
      # tool (5xx rate per endpoint).
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl: same /dev/tcp probe as Keycloak. /dev/tcp
      # is a bash feature; the image's /bin/sh is dash, hence bash -c.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  web:
    image: localhost/cv-generator-web:${CV_VERSION}
    ports:
      - "127.0.0.1:${WEB_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp
      # The entrypoint renders the nginx template here at start.
      - /etc/nginx/conf.d:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped

  # Synthetic traffic: a service account (client cv-synthetic) that calls the
  # API through the entry point, like a user, every 2 seconds. It gives the
  # "status" tool real requests to measure right after a release, also in an
  # environment nobody is using. Read-only calls only.
  synthetic:
    image: docker.io/curlimages/curl:8.22.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        base=http://web:8080
        while true; do
          token=$$(curl -s -u "cv-synthetic:$$CLIENT_SECRET" -d grant_type=client_credentials \
            "$$base/realms/cv-generator/protocol/openid-connect/token" |
            sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          i=0
          while [ "$$i" -lt 30 ]; do
            for path in /api/me /api/profile; do
              curl -s -o /dev/null -H "Authorization: Bearer $$token" "$$base$$path"
            done
            sleep 2
            i=$$((i + 1))
          done
        done
    environment:
      CLIENT_SECRET: ${CV_SYNTHETIC_CLIENT_SECRET}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 32m
    restart: unless-stopped

volumes:
  pgdata:
