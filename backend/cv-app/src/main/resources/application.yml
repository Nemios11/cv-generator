spring:
  application:
    name: cv-generator
  datasource:
    # Defaults match compose.yaml (local development only); override via environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cvgenerator}
    username: ${DB_USER:cvgenerator}
    password: ${DB_PASSWORD:cvgenerator-dev-only}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from compose.yaml; override with OIDC_ISSUER_URI elsewhere.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/cv-generator}
          # Tokens must be issued for this API (audience mapper in the realm).
          audiences: ${OIDC_AUDIENCE:cv-api}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    oauth:
      client-id: cv-frontend
      use-pkce-with-authorization-code-grant: true
      scopes: openid

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
