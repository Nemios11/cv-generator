name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Personal data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-private-data.sh

  backend:
    name: Backend (Java 25, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/cv-app/target/cv-app-*.jar
          retention-days: 1

  frontend:
    name: Frontend (build + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Separate step so that type/build errors are visible in the log
      # (Playwright's webServer hides the build output).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

  stack:
    name: Full stack (compose + API + login e2e)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: dist
      - name: Start Postgres and Keycloak
        run: docker compose up -d --wait --wait-timeout 300
      - name: Keycloak realm is published
        run: curl -fsS http://localhost:8180/realms/cv-generator/.well-known/openid-configuration | grep -q '"issuer":"http://localhost:8180/realms/cv-generator"'
      - name: Start the API
        run: |
          nohup java -jar dist/cv-app-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat api.log; exit 1
      - name: The API rejects anonymous and invalid tokens
        run: |
          for path in /api/me /api/profile; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080$path)" = 401
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer not-a-token' http://localhost:8080$path)" = 401
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v3/api-docs)" = 200
      - name: Login e2e (PKCE via Keycloak, profile CRUD through the API)
        working-directory: frontend
        env:
          CI: "true"
          E2E_AUTH: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/auth.spec.ts
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          cat api.log || true
      - name: Tear down
        if: always()
        run: docker compose down -v
